[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicray-rne"
version = "0.1.0"
description = "Portable weather correction and Forbush-decrease analysis for COREA cosmic-ray observations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gyeonggibuk Science High School R&E" }]
dependencies = []

[project.scripts]
cosmicray-rne = "cosmicray_rne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
